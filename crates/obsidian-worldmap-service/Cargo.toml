[package]
name = "obsidian-worldmap-service"
version = "0.0.0"
edition = "2024"

[dependencies]
base64 = "0.22"
chrono = { workspace = true }
obsidian-auth = { workspace = true }
obsidian-common = { workspace = true }
obsidian-db = { workspace = true }
obsidian-instances = { workspace = true }
obsidian-java = { workspace = true }
obsidian-loaders = { workspace = true }
obsidian-runner = { workspace = true }
obsidian-worldmap = { workspace = true }
piston-mc = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
notify = "8"
rayon = "1"
thread-priority = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
